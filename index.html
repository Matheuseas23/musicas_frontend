<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#09060f">
    <title>Minhas Músicas</title>
    <meta name="description" content="Minhas Músicas: lista de músicas com capa e trecho de 30 segundos, no visual Liquid Glass do iPhone.">
    <link rel="icon" href="itunes.jpeg" type="image/jpeg">
    <link rel="apple-touch-icon" href="icone-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Minhas Músicas">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Filtro da água do Liquid Glass (iOS 26): o CSS usa ele no vidro -->
    <svg class="filtros" aria-hidden="true" focusable="false">
        <filter id="agua" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.009 0.014" numOctaves="2" seed="11" result="ruido" />
            <feGaussianBlur in="ruido" stdDeviation="1.5" result="ondas" />
            <feDisplacementMap in="SourceGraphic" in2="ondas" scale="42" xChannelSelector="R" yChannelSelector="B" />
        </filter>
    </svg>

    <!-- Intro "evolução da TI": 6 IAs se juntam no Claude, a câmera mergulha nele e passa
         por 4 fases, uma dentro da tela da outra; depois volta e aparece a logo do site -->
    <div class="abertura" aria-hidden="true">
        <div class="intro-ias">
            <span class="ia ia-chatgpt"></span>
            <span class="ia ia-gemini"></span>
            <span class="ia ia-copilot"></span>
            <span class="ia ia-claude"></span>
            <span class="ia ia-antigravity"></span>
            <span class="ia ia-github"></span>
        </div>

        <div class="intro-mergulho">
            <div class="fase fase-1">
                <div class="fase-zoom">
                    <img src="intro/fase1.jpg" alt="">
                    <p class="fase-legenda"><b>1981</b> A era do tubo</p>
                </div>
            </div>
            <div class="fase fase-2">
                <div class="fase-zoom">
                    <img src="intro/fase2.jpg" alt="">
                    <p class="fase-legenda"><b>2016</b> O PC moderno</p>
                </div>
            </div>
            <div class="fase fase-3">
                <div class="fase-zoom">
                    <img src="intro/fase3.jpg" alt="">
                    <img class="adesivo adesivo-qr" src="intro/qr.svg" alt="">
                    <img class="adesivo adesivo-pix" src="intro/pix.svg" alt="">
                    <p class="fase-legenda"><b>2020</b> QR Code, Pix e a primeira IA</p>
                </div>
            </div>
            <div class="fase fase-4">
                <div class="fase-zoom">
                    <img src="intro/fase4.jpg" alt="">
                    <div class="ias-hoje">
                        <span class="hoje ia-chatgpt"></span>
                        <span class="hoje ia-gemini"></span>
                        <span class="hoje ia-copilot"></span>
                        <span class="hoje ia-claude"></span>
                        <span class="hoje ia-antigravity"></span>
                        <span class="hoje ia-github"></span>
                    </div>
                    <p class="fase-legenda"><b>Hoje</b> As IAs e o código</p>
                </div>
            </div>
        </div>

        <div class="intro-brilho"></div>
        <div class="intro-logo"><img src="logo.png" alt="" width="160" height="160"></div>
    </div>

    <!-- Fundo animado: 2 manchas roxas desfocadas se mexendo -->
    <div class="fundo" aria-hidden="true"></div>

    <header>
        <a class="logo" href="index.html" aria-label="Minhas Músicas: início"><img src="logo.png" alt="" width="64" height="64"></a>

        <nav class="barra" aria-label="Navegação">
            <a class="ativo" href="index.html" aria-current="page">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.2 12 4l8 6.2V19a1.5 1.5 0 0 1-1.5 1.5H15v-5.5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5.5H5.5A1.5 1.5 0 0 1 4 19z" /></svg>
                <span>Início</span>
            </a>
            <a href="cadastrar.html">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><path d="M12 8.5v7M8.5 12h7" /></svg>
                <span>Cadastrar música</span>
            </a>
        </nav>

        <div class="marca">
            <div class="marca-texto">
                <p>Projeto</p>
                <h1>Minhas Músicas</h1>
            </div>
        </div>
    </header>

    <main>
        <section id="listaMusicas" aria-label="Lista de músicas"></section>
    </main>

    <script src="index.js"></script>
</body>
</html>
