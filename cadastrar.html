<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#09060f">
    <title>Cadastrar música · Minhas Músicas</title>
    <meta name="description" content="Cadastre uma música no Minhas Músicas.">
    <link rel="icon" href="itunes.jpeg" type="image/jpeg">
    <link rel="apple-touch-icon" href="icone-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Minhas Músicas">
    <link rel="stylesheet" href="cadastrar.css">
</head>
<body>
    <!-- Filtro da água do Liquid Glass (iOS 26): o CSS usa ele no vidro -->
    <svg class="filtros" aria-hidden="true" focusable="false">
        <filter id="agua" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.009 0.014" numOctaves="2" seed="11" result="ruido" />
            <feGaussianBlur in="ruido" stdDeviation="1.5" result="ondas" />
            <feDisplacementMap in="SourceGraphic" in2="ondas" scale="42" xChannelSelector="R" yChannelSelector="B" />
        </filter>
    </svg>

    <!-- Fundo animado: 2 manchas roxas desfocadas se mexendo -->
    <div class="fundo" aria-hidden="true"></div>

    <header>
        <a class="logo" href="index.html" aria-label="Minhas Músicas: início"><img src="itunes.jpeg" alt="" width="56" height="56"></a>

        <nav class="barra" aria-label="Navegação">
            <a href="index.html">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.2 12 4l8 6.2V19a1.5 1.5 0 0 1-1.5 1.5H15v-5.5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5.5H5.5A1.5 1.5 0 0 1 4 19z" /></svg>
                <span>Início</span>
            </a>
            <a class="ativo" href="cadastrar.html" aria-current="page">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><path d="M12 8.5v7M8.5 12h7" /></svg>
                <span>Cadastrar música</span>
            </a>
        </nav>
    </header>

    <main>
        <a class="voltar" href="index.html">Voltar para a lista</a>
        <h1>Cadastrar música</h1>

        <section class="painel" aria-label="Dados da música">
            <div class="campo">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" placeholder="Ex.: Evidências" autocomplete="off">
            </div>
            <div class="campo">
                <label for="artista">Artista</label>
                <input type="text" id="artista" placeholder="Ex.: Chitãozinho e Xororó" autocomplete="off">
            </div>
            <div class="campo">
                <label for="genero">Gênero</label>
                <input type="text" id="genero" placeholder="Ex.: Sertanejo" autocomplete="off">
            </div>
            <div class="campo">
                <label for="ano">Ano</label>
                <input type="number" id="ano" placeholder="Ex.: 1990">
            </div>
            <div class="campo">
                <label for="duracao">Duração em minutos</label>
                <input type="number" id="duracao" placeholder="Ex.: 5">
            </div>
            <button id="botaoCadastrar" type="button">Cadastrar</button>
        </section>
    </main>

    <script src="cadastrar.js"></script>
</body>
</html>
